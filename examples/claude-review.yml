# Copy to .github/workflows/claude-review.yml in each repo you want swept.
#
# Runs the SAME skill your local /pr-review-kit:pr-review runs, on a cheaper model.
# Triggered by commenting "@claude review" on a PR.

name: Claude Review

on:
  issue_comment:
    types: [created]
  # Uncomment to review every PR automatically on open. Costs more; the
  # comment trigger above keeps you in control of when a review runs.
  # pull_request:
  #   types: [opened, ready_for_review]

jobs:
  review:
    # Only PR comments containing the trigger phrase. Without this gate a
    # runner spins up for every comment in the repo.
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write        # required to add the 👍 reaction
      id-token: write      # required for the action's GitHub App auth
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          # The skill shells out to `gh`, which reads this. It also decides
          # whose name lands on the comments — here, the Actions bot.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lets the skill 👍 the exact comment that triggered it.
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/mherman22/pr-review-kit.git"
          plugins: "pr-review-kit@digi-tools"
          # Plugin skills are namespaced <plugin>:<skill>. A bare "/pr-review"
          # does not resolve and the run will silently do nothing useful.
          prompt: "/pr-review-kit:pr-review ${{ github.event.issue.number }} --post --react"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
